# Intranet deployment: postgres + one-shot migrations + app + worker.
# Configuration comes from a .env file next to this compose file
# (see ../.env.example for every variable).
#
#   cd docker && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sodalis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sodalis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sodalis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: &dburl postgres://${POSTGRES_USER:-sodalis}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-sodalis}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    env_file: .env
    environment:
      DATABASE_URL: *dburl
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: *dburl
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
