services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sodalis
      POSTGRES_PASSWORD: sodalis
      POSTGRES_DB: sodalis
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sodalis"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP — point SMTP_HOST=localhost SMTP_PORT=1025 at it
      - "8025:8025" # Web UI

volumes:
  pgdata-dev:
